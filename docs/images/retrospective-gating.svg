<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="294" viewBox="16 92 1048 294" overflow="hidden" role="img" aria-labelledby="title desc">
<title id="title">Retrospective cardiac gating: a synthetic illustration</title>
<desc id="desc">Five synthetic optical sections start at different phases. After prescribed phase offsets are removed, their periodic motion is synchronized and the sections form a coherent volume. This animation does not show microscopy data or MATLAB estimator output.</desc>
